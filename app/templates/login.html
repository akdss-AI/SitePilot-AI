{% extends "base.html" %}
{% block title %}Log in — SitePilot AI{% endblock %}
{% block content %}
<section class="auth-form">
  <h1>Log in</h1>
  <p>Log in to see your dashboard and daily summaries.</p>
  {% if error %}
  <p class="form-error">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login">
    <label for="username">Email</label>
    <input id="username" name="username" type="email" required autocomplete="email">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button type="submit">Log in</button>
  </form>
  <p class="fine-print">Demo system — all data shown is fictional.</p>
</section>
{% endblock %}
